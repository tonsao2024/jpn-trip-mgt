<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    Fuji Mascot Sprite (ไฟล์เดียว ทุกสถานะ ตามข้อ 38)
    ใช้งาน: <svg class="fuji"><use href="/fuji-mascot.svg#fuji-happy"/></svg>
    สีปรับตามธีมผ่าน CSS Variables: --fuji-top --fuji-bottom --fuji-snow --fuji-ink --fuji-blush
    สถานะ: idle, happy, loading, warning, error (เคลื่อนไหวด้วย CSS class: .fuji--loading ฯลฯ)
  -->
  <defs>
    <linearGradient id="fujiG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--fuji-top,#7ea6f4)" />
      <stop offset="1" style="stop-color:var(--fuji-bottom,#4a6fd4)" />
    </linearGradient>
  </defs>

  <!-- แผนกลางใช้ร่วมกันทุกสถานะ -->
  <symbol id="fuji-body" viewBox="0 0 120 120">
    <path d="M60 20 L98 92 Q100 98 92 98 L28 98 Q20 98 22 92 Z" fill="url(#fujiG)" />
    <path d="M60 20 L73.5 46 Q69 53 64.5 46.5 Q60 55 53.5 47.5 Q47.5 53 46.5 45.5 Z"
      style="fill:var(--fuji-snow,#ffffff)" />
  </symbol>

  <symbol id="fuji-idle" viewBox="0 0 120 120">
    <use href="#fuji-body" />
    <circle cx="50" cy="72" r="3.2" style="fill:var(--fuji-ink,#2c3a5c)" />
    <circle cx="70" cy="72" r="3.2" style="fill:var(--fuji-ink,#2c3a5c)" />
    <path d="M55 81 Q60 86 65 81" stroke="var(--fuji-ink,#2c3a5c)" stroke-width="2.4" fill="none" stroke-linecap="round" />
    <circle cx="41" cy="79" r="3.6" style="fill:var(--fuji-blush,#f7b2c4)" opacity="0.85" />
    <circle cx="79" cy="79" r="3.6" style="fill:var(--fuji-blush,#f7b2c4)" opacity="0.85" />
  </symbol>

  <symbol id="fuji-happy" viewBox="0 0 120 120">
    <use href="#fuji-body" />
    <path d="M45 72 Q50 65 55 72" stroke="var(--fuji-ink,#2c3a5c)" stroke-width="2.6" fill="none" stroke-linecap="round" />
    <path d="M65 72 Q70 65 75 72" stroke="var(--fuji-ink,#2c3a5c)" stroke-width="2.6" fill="none" stroke-linecap="round" />
    <path d="M51 79 Q60 91 69 79 Q60 83 51 79 Z" style="fill:var(--fuji-ink,#2c3a5c)" />
    <circle cx="40" cy="78" r="4.2" style="fill:var(--fuji-blush,#f7b2c4)" opacity="0.95" />
    <circle cx="80" cy="78" r="4.2" style="fill:var(--fuji-blush,#f7b2c4)" opacity="0.95" />
    <path d="M84 34 L88 26 L92 34" stroke="#f6c66d" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </symbol>

  <symbol id="fuji-loading" viewBox="0 0 120 120">
    <use href="#fuji-body" />
    <path d="M46 72 Q50 68 54 72" stroke="var(--fuji-ink,#2c3a5c)" stroke-width="2.6" fill="none" stroke-linecap="round" />
    <path d="M66 72 Q70 68 74 72" stroke="var(--fuji-ink,#2c3a5c)" stroke-width="2.6" fill="none" stroke-linecap="round" />
    <circle cx="60" cy="83" r="3" style="fill:var(--fuji-ink,#2c3a5c)" />
    <circle cx="41" cy="79" r="3.4" style="fill:var(--fuji-blush,#f7b2c4)" opacity="0.8" />
    <circle cx="79" cy="79" r="3.4" style="fill:var(--fuji-blush,#f7b2c4)" opacity="0.8" />
    <g stroke="#9ecbff" stroke-width="2.4" stroke-linecap="round">
      <path d="M24 42 L28 46" />
      <path d="M92 42 L88 46" />
      <path d="M58 8 L58 14" />
    </g>
  </symbol>

  <symbol id="fuji-warning" viewBox="0 0 120 120">
    <use href="#fuji-body" />
    <circle cx="50" cy="72" r="3.2" style="fill:var(--fuji-ink,#2c3a5c)" />
    <circle cx="70" cy="72" r="3.2" style="fill:var(--fuji-ink,#2c3a5c)" />
    <path d="M54 83 L66 83" stroke="var(--fuji-ink,#2c3a5c)" stroke-width="2.6" fill="none" stroke-linecap="round" />
    <path d="M87 58 Q92 66 87 70 Q82 66 87 58 Z" fill="#9ecbff" />
    <circle cx="41" cy="79" r="3.4" style="fill:var(--fuji-blush,#f7b2c4)" opacity="0.7" />
    <circle cx="79" cy="79" r="3.4" style="fill:var(--fuji-blush,#f7b2c4)" opacity="0.7" />
  </symbol>

  <symbol id="fuji-error" viewBox="0 0 120 120">
    <use href="#fuji-body" />
    <g stroke="var(--fuji-ink,#2c3a5c)" stroke-width="2.4" stroke-linecap="round">
      <path d="M46 68 L54 76" /><path d="M54 68 L46 76" />
      <path d="M66 68 L74 76" /><path d="M74 68 L66 76" />
    </g>
    <path d="M51 85 Q55 81 59 85 Q63 89 67 85" stroke="var(--fuji-ink,#2c3a5c)" stroke-width="2.4" fill="none" stroke-linecap="round" />
    <circle cx="40" cy="80" r="3" style="fill:var(--fuji-blush,#f7b2c4)" opacity="0.6" />
    <circle cx="80" cy="80" r="3" style="fill:var(--fuji-blush,#f7b2c4)" opacity="0.6" />
  </symbol>
</svg>
